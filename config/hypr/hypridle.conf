general {
    lock_cmd = /home/elkip/.local/share/quickshell-lockscreen/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    inhibit_sleep = 2
}

# Lock screen after 30 minutes of idle (deferred if media is playing)
listener {
    timeout = 1800                                                      # 30 minutes
    on-timeout = loginctl lock-session
    condition_cmd = ! playerctl -a status 2>/dev/null | grep -q Playing
    condition_retry = 30
}

# Turn monitors off after 45 minutes of idle (deferred if media is playing)
listener {
    timeout = 2700                                                      # 45 minutes
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
    condition_cmd = ! playerctl -a status 2>/dev/null | grep -q Playing
    condition_retry = 30
}
