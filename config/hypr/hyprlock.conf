general {
    hide_cursor = true
    ignore_empty_input = true
}

# Primary monitor (BenQ 1440p) - main lock screen
background {
    monitor = HDMI-A-1
    path = screenshot
    blur_passes = 2
    blur_size = 8
    noise = 0.02
    brightness = 0.6
}

input-field {
    monitor = HDMI-A-1
    size = 400, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(B292E9)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 15
    check_color = rgb(6c9fd3)
    fail_color = rgb(ee2e24)
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    capslock_color = rgb(009ddc)
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = $TIME
    color = rgb(ffffff)
    font_size = 120
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] date "+%A, %B %e"
    color = rgb(B292E9)
    font_size = 24
    font_family = JetBrains Mono
    position = 0, -20
    halign = center
    valign = center
}

# Secondary monitor (Samsung 1080p) - just blurred screenshot
background {
    monitor = DP-3
    path = screenshot
    blur_passes = 3
    blur_size = 10
    noise = 0.02
    brightness = 0.4
}
